name: Release

on:
  push:
    tags:
      - 'v*'        # 只有 v 开头的 tag 才触发，例如 v1.0.26

permissions:
  contents: write    # 让 GITHUB_TOKEN 有权创建/写 Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build & Publish
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
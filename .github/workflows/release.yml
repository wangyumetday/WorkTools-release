name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # ================================================================
      # Phase 1: 构建 —— electron-builder 只产生产物，完全不碰 GitHub
      #   产出位置：release/${version}/ （如 release/1.3.2/）
      #   包含：.exe + latest.yml + .blockmap
      # ================================================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 拉全量历史 + 所有 tag：生成更新日志时要用 git log <上个tag>..HEAD 算提交区间
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Version check
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $expectedTag = "v$ver"
          if ($tag -ne $expectedTag) {
            Write-Error "package.json version is $ver → expected tag $expectedTag, but you pushed $tag"
            exit 1
          }
          Write-Host "OK: version=$ver matches tag=$tag"

      - name: Build（纯本地，不触 GitHub）
        run: npm run build && npx electron-builder --publish never

      # ================================================================
      # Phase 1.5: 生成更新日志 —— 取"上个 tag → 本次 tag"之间的
      #   每次提交的【摘要 + 详情】（对应 GitHub Desktop 的标题 + 描述文本域）：
      #   - subject (%s) 作为条目行，后跟短 hash
      #   - body (%b) 的每个非空行缩进 4 空格排在下方（无 body 则只显示摘要）
      #   写入 RELEASE_NOTES.md 作为 Release body，electron-updater 作为
      #   releaseNotes 推给客户端更新弹窗。不用 GitHub 自动生成 notes
      #   （那套按 PR 归类，直接 push 无 PR 时 body 只剩一行 compare 版本号）。
      # ================================================================
      - name: Generate changelog from commits
        shell: pwsh
        run: |
          $current = "${{ github.ref_name }}"
          $tags = @(git tag --sort=-v:refname)
          $prev = $tags | Where-Object { $_ -ne $current } | Select-Object -First 1
          # git pretty 用 0x1f 分隔字段（hash|subject|body）、0x1e 分隔记录，
          # 保证 body 含多行也能被安全切分
          if ($prev) {
            Write-Host "Commits between $prev and $current :"
            $rawText = (git log "$prev..HEAD" "--pretty=format:%h%x1f%s%x1f%b%x1e") -join "`n"
          } else {
            Write-Host "No previous tag found, listing all commits:"
            $rawText = (git log "--pretty=format:%h%x1f%s%x1f%b%x1e") -join "`n"
          }
          $RS = [char]0x1e
          $FS = [char]0x1f
          $out = New-Object System.Collections.Generic.List[string]
          foreach ($rec in ($rawText -split [regex]::Escape($RS))) {
            if ($rec.Trim().Length -eq 0) { continue }
            $parts = $rec.Split([char[]]@($FS), 3)
            $hash = $parts[0].Trim()
            $subject = if ($parts.Length -ge 2) { $parts[1].Trim() } else { '' }
            if (-not $subject) { continue }
            $out.Add("- $subject  ($hash)")
            if ($parts.Length -ge 3 -and $parts[2].Trim().Length -gt 0) {
              foreach ($line in ($parts[2] -split "`r?`n")) {
                $t = $line.Trim()
                if ($t.Length -gt 0) { $out.Add("    $t") }
              }
            }
          }
          $body = ($out -join "`n")
          [System.IO.File]::WriteAllText((Join-Path $PWD 'RELEASE_NOTES.md'), $body, [System.Text.UTF8Encoding]::new($false))
          Write-Host "----- RELEASE_NOTES.md -----"
          Get-Content RELEASE_NOTES.md

      # ================================================================
      # Phase 2: 发布 —— 交给社区最成熟的 action
      #   softprops/action-gh-release：7k+ star，被数千项目使用
      #   关键能力：
      #   - make_latest: true    → 自动标记为 latest
      #   - overwrite_files: true → 幂等，重跑会覆盖同名 asset
      #   - fail_on_unmatched_files: true → 构建失败没产物时直接报错
      # ================================================================
      - name: Release to GitHub
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # 上传 electron-builder 全部产物
          # latest.yml 是 electron-updater 查找更新的关键元数据
          # glob 用 release/*/ 因为目录名是纯数字版本号（release/1.3.2/）
          files: |
            release/*/*.exe
            release/*/*.yml
            release/*/*.blockmap
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          # 更新日志用上一步 git log 生成的 commit 摘要（不用 GitHub 自动生成 notes）
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    tags:
      - 'v*'        # 只有 v 开头的 tag 才触发，例如 v1.0.26

permissions:
  contents: write    # 让 GITHUB_TOKEN 有权创建/写 Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build & Publish
        run: npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-generate release notes from git log
        run: |
          # 找最近的一个 tag（排除当前这个 v* tag 本身）
          $prevTag = git tag --sort=-creatordate | Where-Object { $_ -ne "${{ github.ref_name }}" } | Select-Object -First 1
          if ($prevTag) {
            # 有上一个 tag → 生成其间所有 commit 作为 changelog
            git log "$prevTag"..${{ github.ref_name }} --pretty=format:'- %s' --no-merges | Out-File -FilePath CHANGELOG_TMP.txt -Encoding utf8
          } else {
            # 第一个正式发布 → 从仓库起点取所有 commit
            git log --pretty=format:'- %s' --no-merges | Out-File -FilePath CHANGELOG_TMP.txt -Encoding utf8
          }
          gh release edit ${{ github.ref_name }} --notes-file CHANGELOG_TMP.txt --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
